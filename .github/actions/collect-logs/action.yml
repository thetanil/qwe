name: collect-logs
description: Upload the test logs and each test's undeclared outputs (sanitizer and valgrind reports), then show each failed test's log in the run (annotation, job summary, and this step).
inputs:
  name:
    description: Artifact name.
    required: true
runs:
  using: composite
  steps:
    - name: Gather
      shell: bash
      run: |
        dest="$RUNNER_TEMP/testlogs"
        mkdir -p "$dest"
        cd "$(bazel info bazel-testlogs 2>/dev/null)" || exit 0
        find . \( -name test.log -o -name outputs.zip -o -name test.outputs \) -print0 |
          xargs -0 -r cp -r --parents -t "$dest"
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/testlogs
        if-no-files-found: warn
    # Last, because it fails when it finds a failed test: that makes it the step a failed job opens
    # on, and the end of `gh run view --log-failed`, instead of bazel's "see <path>/test.log" on a
    # runner that no longer exists.
    - name: Failed tests
      shell: bash
      run: .github/scripts/test-failures.sh
