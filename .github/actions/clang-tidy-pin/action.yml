name: clang-tidy-pin
description: >
  Installs the exact clang-tidy tools/clang-tidy/pin.env pins (LLVM's own GitHub release
  tarball, verified against its published sha256) and puts it first on PATH. Cached by the
  pinned version and hash, which never change, so only the very first run downloads it.
runs:
  using: composite
  steps:
    - name: Read the pin
      shell: bash
      run: |
        set -eu
        . tools/clang-tidy/pin.env
        {
          echo "CLANG_TIDY_MAJOR=$CLANG_TIDY_MAJOR"
          echo "CLANG_TIDY_VERSION=$CLANG_TIDY_VERSION"
          echo "CLANG_TIDY_URL=$CLANG_TIDY_URL"
          echo "CLANG_TIDY_SHA256=$CLANG_TIDY_SHA256"
          echo "CLANG_TIDY_TARBALL_ROOT=$CLANG_TIDY_TARBALL_ROOT"
        } >>"$GITHUB_ENV"
    - name: Restore the pinned clang-tidy from cache
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ github.workspace }}/.clang-tidy-pin
        key: clang-tidy-pin-${{ env.CLANG_TIDY_VERSION }}-${{ env.CLANG_TIDY_SHA256 }}
    - name: Download and verify the pinned clang-tidy
      # `ldd` on the LLVM release build's bin/clang-tidy shows it needs nothing from the
      # tarball at runtime beyond libm/libz/libc (the runner's own) -- but clang-tidy also
      # needs its resource directory (lib/clang/<major>/include: stddef.h, stdarg.h, ...,
      # the compiler-builtin headers, found by walking up from the binary's own path, same
      # as clang itself) to preprocess anything. Extracting only bin/clang-tidy, without
      # that directory next to it in the same layout, made every file "stddef.h file not
      # found", and the resulting broken preprocessing produced unrelated bogus findings
      # downstream (run 36317103321). Both directories come from the ~2 GB tarball, but
      # together are a few hundred MB, not the whole tree, and that's what gets cached.
      # The member paths are built from CLANG_TIDY_TARBALL_ROOT (pin.env), not discovered
      # by listing the archive first: `tar -tJf` on this single-stream xz tarball has to
      # decompress everything up to the last entry it prints, and piping that into
      # anything that stops reading early races tar's own stdio buffering -- exactly this,
      # on a real runner, decompressed gigabytes before its buffer next flushed, found the
      # reader long gone, and failed the whole step on the write error (run 36315912964).
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -eu
        dir="$GITHUB_WORKSPACE/.clang-tidy-pin"
        mkdir -p "$dir"
        tmp=$(mktemp -d)
        trap 'rm -rf "$tmp"' EXIT
        curl -sSL -o "$tmp/llvm.tar.xz" "$CLANG_TIDY_URL"
        echo "$CLANG_TIDY_SHA256  $tmp/llvm.tar.xz" | sha256sum -c -
        tar -xJf "$tmp/llvm.tar.xz" -C "$tmp" \
          "$CLANG_TIDY_TARBALL_ROOT/bin/clang-tidy" \
          "$CLANG_TIDY_TARBALL_ROOT/lib/clang/$CLANG_TIDY_MAJOR/include"
        mkdir -p "$dir/bin" "$dir/lib/clang/$CLANG_TIDY_MAJOR"
        install -m 0755 "$tmp/$CLANG_TIDY_TARBALL_ROOT/bin/clang-tidy" "$dir/bin/clang-tidy"
        cp -r "$tmp/$CLANG_TIDY_TARBALL_ROOT/lib/clang/$CLANG_TIDY_MAJOR/include" \
          "$dir/lib/clang/$CLANG_TIDY_MAJOR/include"
    - name: Save the pinned clang-tidy to cache
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ github.workspace }}/.clang-tidy-pin
        key: clang-tidy-pin-${{ env.CLANG_TIDY_VERSION }}-${{ env.CLANG_TIDY_SHA256 }}
    - name: Put the pinned clang-tidy first on PATH
      shell: bash
      run: echo "$GITHUB_WORKSPACE/.clang-tidy-pin/bin" >>"$GITHUB_PATH"
    - name: clang-tidy is the pinned version
      shell: bash
      run: |
        set -eu
        clang-tidy --version
        got=$(clang-tidy --version | grep -oE 'version [0-9]+\.[0-9]+\.[0-9]+' | head -1 | cut -d' ' -f2)
        [ "$got" = "$CLANG_TIDY_VERSION" ] || {
          echo "clang-tidy-pin: got $got, tools/clang-tidy/pin.env pins $CLANG_TIDY_VERSION" >&2
          exit 1
        }
