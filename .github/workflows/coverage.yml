name: coverage
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-coverage-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          apt: lcov
          cache-key: coverage
          ssh-target: "true"
      - run: bazel run //tools/coverage:check
      - name: HTML report
        if: always()
        run: bazel run //tools/coverage:html
      - name: Coverage badge document
        if: always()
        run: |
          rep=bazel-out/_coverage/_coverage_report.dat
          [ -f "$rep" ] || exit 0
          [ -d coverage-html ] || exit 0
          tools/coverage/badge.sh "$rep" > coverage-html/coverage.json
          cat coverage-html/coverage.json
          { echo '### Badge'; echo '```'; cat coverage-html/coverage.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Totals in the job summary
        if: always()
        run: |
          rep=bazel-out/_coverage/_coverage_report.dat
          [ -f "$rep" ] || exit 0
          tools/coverage/ours.sh "$rep" > "$RUNNER_TEMP/ours.info"
          lcov --extract "$RUNNER_TEMP/ours.info" '*.c' '*.h' -o "$RUNNER_TEMP/c.info" >/dev/null 2>&1 || true
          lcov --extract "$RUNNER_TEMP/ours.info" '*.lua' -o "$RUNNER_TEMP/lua.info" >/dev/null 2>&1 || true
          {
            echo '### Combined (src/ and plugins/)'; echo '```'; lcov --summary "$RUNNER_TEMP/ours.info" 2>&1; echo '```'
            echo '### C'; echo '```'; lcov --summary "$RUNNER_TEMP/c.info" 2>&1 || true; echo '```'
            echo '### Lua'; echo '```'; lcov --summary "$RUNNER_TEMP/lua.info" 2>&1 || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: coverage-html/
          if-no-files-found: warn
      - if: failure()
        uses: ./.github/actions/collect-logs
        with:
          name: coverage-logs
  pages:
    # Publishes the report and coverage.json on a green push to main (Settings -> Pages -> GitHub Actions).
    needs: coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage-html
          path: coverage-html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: coverage-html
      - id: deploy
        uses: actions/deploy-pages@v4
