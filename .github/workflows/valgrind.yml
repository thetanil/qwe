name: valgrind
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-valgrind-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          apt: valgrind
          cache-key: valgrind
          ssh-target: "true"
      - run: valgrind --version
      - run: bazel test --config=valgrind //...
      - if: failure()
        uses: ./.github/actions/collect-logs
        with:
          name: valgrind-unit-logs
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          apt: valgrind
          cache-key: valgrind
          ssh-target: "true"
      - run: valgrind --version
      - run: bazel test --config=valgrind //tests/e2e:valgrind_e2e
      - if: failure()
        uses: ./.github/actions/collect-logs
        with:
          name: valgrind-e2e-logs
  static-analysis:
    # Static (clang-tidy/clang-analyzer) alongside dynamic (valgrind): same cadence,
    # same workflow file, docs/static-analysis.md.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          apt: clang-tidy
          cache-key: static-analysis
      - run: clang-tidy --version
      - run: tools/clang-tidy/run.sh
      - if: failure()
        uses: ./.github/actions/collect-logs
        with:
          name: static-analysis-logs
