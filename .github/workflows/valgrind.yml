name: valgrind
# Not on push (23 minutes is too slow to gate one) or pull_request. Runs by hand
# (workflow_dispatch), at the tag in a release (workflow_call from release.yml), and on its
# own schedule -- offset 13 minutes after nightly.yml's cron, past its cache-refresh step --
# so it has a direct trigger of its own: a workflow_call from another workflow's job never
# updates this file's own badge, only push/pull_request/schedule/workflow_dispatch do.
on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "30 2 * * *"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-valgrind-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          apt: valgrind
          cache-key: valgrind
          ssh-target: "true"
      - run: valgrind --version
      - run: bazel test --config=valgrind //...
      - if: failure()
        uses: ./.github/actions/collect-logs
        with:
          name: valgrind-unit-logs
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          apt: valgrind
          cache-key: valgrind
          ssh-target: "true"
      - run: valgrind --version
      - run: bazel test --config=valgrind //tests/e2e:valgrind_e2e
      - if: failure()
        uses: ./.github/actions/collect-logs
        with:
          name: valgrind-e2e-logs
