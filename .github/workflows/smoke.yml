name: smoke
# Proves the release binary does real work on a clean Linux machine, not just inside the Bazel
# sandbox, and times it. build makes the release binary once and uploads it. smoke runs that
# binary's smoke workflows and negative cases on a clean runner with --debug tracing on (the
# lifecycle traces are kept when it fails), one GitHub step per workflow, each appending its
# report to the run summary. perf times the same binary and compares it with the stored
# expected values in tools/perf/expected.tsv
# (docs/adr/0016-perf-gate-compares-with-stored-expectations.md): release.yml and a manual
# dispatch gate on it; a push and nightly.yml only report, so runner drift never turns main red.
#
# No test suite runs here: tests.yml runs the whole suite on the same push, and release.yml
# and nightly.yml call tests.yml too. --config=release only adds -g to the same codegen.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rounds:
        description: "Timed rounds for the perf job (one warm-up round runs first and is discarded)."
        default: "51"
      perf-gate:
        description: "Fail the perf job on a regression against tools/perf/expected.tsv (false: report only)."
        type: boolean
        default: true
  workflow_call:
    inputs:
      rounds:
        type: string
        default: "51"
      perf-gate:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-smoke-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: release
      - run: bazel build --config=release //src/cli:qwe
      - uses: actions/upload-artifact@v7
        with:
          name: qwe-build
          path: bazel-bin/src/cli/qwe
          if-no-files-found: error
  smoke:
    needs: build
    # A fresh runner with no shared setup: that setup's ssh-target step removes passwordless
    # sudo, which the become and apt smoke workflows need, and this job proves the binary needs
    # no Bazel to run.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: qwe-build
          path: .
      - run: chmod +x qwe
      - name: The binary is statically linked
        run: file qwe | grep -q "statically linked" || { file qwe; exit 1; }
      - name: smoke_run
        run: |
          .github/scripts/summary-link.sh tests/smoke/smoke_run.yml
          ./qwe validate tests/smoke/smoke_run.yml &&
          ./qwe run tests/smoke/smoke_run.yml --debug --summary "$GITHUB_STEP_SUMMARY"
      # apt.package (10) needs real apt-get and root: `# smoke: skip-in-bazel:` in
      # smoke_apt.yml itself keeps the full Bazel suite from ever trying to run it, so it
      # needs this explicit step, like smoke_run above.
      - name: smoke_apt
        run: |
          .github/scripts/summary-link.sh tests/smoke/smoke_apt.yml
          ./qwe validate tests/smoke/smoke_apt.yml &&
          ./qwe run tests/smoke/smoke_apt.yml --debug --summary "$GITHUB_STEP_SUMMARY"
      # become (11) needs real passwordless sudo: same skip-in-bazel story as smoke_apt.
      - name: smoke_become
        run: |
          .github/scripts/summary-link.sh tests/smoke/smoke_become.yml
          ./qwe validate tests/smoke/smoke_become.yml &&
          ./qwe run tests/smoke/smoke_become.yml --debug --summary "$GITHUB_STEP_SUMMARY"
      # secrets (11): gen_secrets.sh generates smoke_secrets.yml from its .in template with
      # a fresh per-run encrypted value, runs it, and asserts the value leaked nowhere. The
      # generated file is never committed, so the link is to the template and the generator.
      - name: smoke_secrets
        run: |
          .github/scripts/summary-link.sh tests/smoke/smoke_secrets.yml.in tests/smoke/gen_secrets.sh
          tests/smoke/gen_secrets.sh ./qwe tests/smoke
      # smoke_graph.yml itself is covered generically by tests/smoke:smoke_workflows_test in
      # tests.yml's full suite; these two steps prove --job selection (12) against the shipped
      # binary: --job d runs the full needs closure, --job b only a and b.
      - name: smoke_graph --job d
        run: |
          .github/scripts/summary-link.sh tests/smoke/smoke_graph.yml
          ./qwe validate tests/smoke/smoke_graph.yml &&
          ./qwe run tests/smoke/smoke_graph.yml --job d --debug --summary "$GITHUB_STEP_SUMMARY"
      - name: smoke_graph --job b (only a and b run)
        run: |
          .github/scripts/summary-link.sh tests/smoke/smoke_graph.yml
          ./qwe run tests/smoke/smoke_graph.yml --job b --debug --summary "$GITHUB_STEP_SUMMARY"
      # The negative-case pattern (06), repeated by later tickets: the workflow step is
      # continue-on-error and tees qwe's output to a file; the assertion step right after it
      # fails the job unless the step's outcome was failure and the file has the expected
      # message. neg_file_ensure_denied.yml: file.ensure writing into a chmod 555 directory.
      - name: neg_file_ensure_denied
        id: neg_file_ensure_denied
        continue-on-error: true
        run: |
          set -o pipefail
          ./qwe validate tests/smoke/neg_file_ensure_denied.yml
          ./qwe run tests/smoke/neg_file_ensure_denied.yml --debug 2>&1 | tee "$RUNNER_TEMP/neg_file_ensure_denied.out"
      - name: neg_file_ensure_denied must fail with a helpful message
        run: |
          if [ "${{ steps.neg_file_ensure_denied.outcome }}" != "failure" ]; then
            echo "neg_file_ensure_denied: expected the step to fail, outcome was '${{ steps.neg_file_ensure_denied.outcome }}'" >&2
            exit 1
          fi
          grep -F "file.ensure: cannot write roDir/f.txt: Permission denied" "$RUNNER_TEMP/neg_file_ensure_denied.out" || {
            echo "neg_file_ensure_denied: expected message not found in the step's output" >&2
            exit 1
          }
      # Same negative-case pattern, for file.read (07).
      - name: neg_file_read_denied
        id: neg_file_read_denied
        continue-on-error: true
        run: |
          set -o pipefail
          ./qwe validate tests/smoke/neg_file_read_denied.yml
          ./qwe run tests/smoke/neg_file_read_denied.yml --debug 2>&1 | tee "$RUNNER_TEMP/neg_file_read_denied.out"
      - name: neg_file_read_denied must fail with a helpful message
        run: |
          if [ "${{ steps.neg_file_read_denied.outcome }}" != "failure" ]; then
            echo "neg_file_read_denied: expected the step to fail, outcome was '${{ steps.neg_file_read_denied.outcome }}'" >&2
            exit 1
          fi
          grep -F "file.read: cannot read secret.txt: Permission denied" "$RUNNER_TEMP/neg_file_read_denied.out" || {
            echo "neg_file_read_denied: expected message not found in the step's output" >&2
            exit 1
          }
      # Same negative-case pattern, for assert (08).
      - name: neg_assert_mismatch
        id: neg_assert_mismatch
        continue-on-error: true
        run: |
          set -o pipefail
          ./qwe validate tests/smoke/neg_assert_mismatch.yml
          ./qwe run tests/smoke/neg_assert_mismatch.yml --debug 2>&1 | tee "$RUNNER_TEMP/neg_assert_mismatch.out"
      - name: neg_assert_mismatch must fail with a helpful message
        run: |
          if [ "${{ steps.neg_assert_mismatch.outcome }}" != "failure" ]; then
            echo "neg_assert_mismatch: expected the step to fail, outcome was '${{ steps.neg_assert_mismatch.outcome }}'" >&2
            exit 1
          fi
          grep -F "assert: values differ: expected equals what we wanted, actual not what we wanted" "$RUNNER_TEMP/neg_assert_mismatch.out" || {
            echo "neg_assert_mismatch: expected message not found in the step's output" >&2
            exit 1
          }
      # Same negative-case pattern, for file.line (09).
      - name: neg_file_line_readonly
        id: neg_file_line_readonly
        continue-on-error: true
        run: |
          set -o pipefail
          ./qwe validate tests/smoke/neg_file_line_readonly.yml
          ./qwe run tests/smoke/neg_file_line_readonly.yml --debug 2>&1 | tee "$RUNNER_TEMP/neg_file_line_readonly.out"
      - name: neg_file_line_readonly must fail with a helpful message
        run: |
          if [ "${{ steps.neg_file_line_readonly.outcome }}" != "failure" ]; then
            echo "neg_file_line_readonly: expected the step to fail, outcome was '${{ steps.neg_file_line_readonly.outcome }}'" >&2
            exit 1
          fi
          grep -F "file.line: cannot write roDir/f.txt: Permission denied" "$RUNNER_TEMP/neg_file_line_readonly.out" || {
            echo "neg_file_line_readonly: expected message not found in the step's output" >&2
            exit 1
          }
      # Same negative-case pattern, for apt.package (10): an unknown package name.
      - name: neg_apt_unknown
        id: neg_apt_unknown
        continue-on-error: true
        run: |
          set -o pipefail
          ./qwe validate tests/smoke/neg_apt_unknown.yml
          ./qwe run tests/smoke/neg_apt_unknown.yml --debug 2>&1 | tee "$RUNNER_TEMP/neg_apt_unknown.out"
      - name: neg_apt_unknown must fail with a helpful message
        run: |
          if [ "${{ steps.neg_apt_unknown.outcome }}" != "failure" ]; then
            echo "neg_apt_unknown: expected the step to fail, outcome was '${{ steps.neg_apt_unknown.outcome }}'" >&2
            exit 1
          fi
          grep -F "apt.package: no package no-such-package-xyz" "$RUNNER_TEMP/neg_apt_unknown.out" || {
            echo "neg_apt_unknown: expected message not found in the step's output" >&2
            exit 1
          }
      # Same negative-case pattern, for apt.package (10): installing without become: true.
      - name: neg_apt_no_become
        id: neg_apt_no_become
        continue-on-error: true
        run: |
          set -o pipefail
          ./qwe validate tests/smoke/neg_apt_no_become.yml
          ./qwe run tests/smoke/neg_apt_no_become.yml --debug 2>&1 | tee "$RUNNER_TEMP/neg_apt_no_become.out"
      - name: neg_apt_no_become must fail with a helpful message
        run: |
          if [ "${{ steps.neg_apt_no_become.outcome }}" != "failure" ]; then
            echo "neg_apt_no_become: expected the step to fail, outcome was '${{ steps.neg_apt_no_become.outcome }}'" >&2
            exit 1
          fi
          grep -F "apt.package: cannot install hello: are you root? (set become: true)" "$RUNNER_TEMP/neg_apt_no_become.out" || {
            echo "neg_apt_no_become: expected message not found in the step's output" >&2
            exit 1
          }
      # --debug's lifecycle.trace, kept whenever this job fails: cheap, standing extra signal,
      # never a step to remember to add back.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-runs
          path: .qwe/runs
          if-no-files-found: ignore
  perf:
    needs: build
    # Its own fresh runner, no shared setup: tools/perf/{run,compare}.sh are plain sh + awk,
    # need no Bazel, and the candidate binary must prove it needs none either (same reason as
    # the smoke job above). Only the candidate runs: it is compared with the stored expected
    # values in tools/perf/expected.tsv (docs/adr/0016-perf-gate-compares-with-stored-expectations.md).
    runs-on: ubuntu-24.04
    env:
      ROUNDS: ${{ inputs.rounds || '51' }}
      PERF_GATE: ${{ inputs.perf-gate == true }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: qwe-build
          path: .
      - run: chmod +x qwe
      - name: Time the candidate
        run: |
          .github/scripts/summary-link.sh tools/perf/run.sh tools/perf/compare.sh tools/perf/expected.tsv
          tools/perf/run.sh perf-out "$ROUNDS" "$PWD/qwe" \
            tests/smoke/smoke_run.yml tests/smoke/smoke_file.yml tests/smoke/smoke_graph.yml tests/smoke/smoke_project_plugin.yml
      - name: Report header
        run: |
          {
            echo "## perf: candidate \`${GITHUB_SHA:0:7}\` vs expected values \`$(sed -n 's/^# version: //p' tools/perf/expected.tsv)\`"
            echo
            echo "- runner: $(nproc) vCPU, $(awk -F: '/model name/{print $2; exit}' /proc/cpuinfo | sed 's/^ *//'), $(uname -r)"
            echo "- rounds: $ROUNDS"
            echo "- gating: $PERF_GATE (release.yml and a manual dispatch gate; a push and nightly only report)"
            echo
          } >>"$GITHUB_STEP_SUMMARY"
      # Exit 1 is a regression: it fails the job only when gating (release.yml, a manual dispatch).
      # Any other failure (a malformed expected file, a usage error) always fails it.
      - name: Compare with the expected values
        run: |
          rc=0
          tools/perf/compare.sh tools/perf/expected.tsv perf-out/samples.tsv tools/perf/allow-list.txt perf-out || rc=$?
          [ "$rc" -eq 0 ] && exit 0
          [ "$rc" -eq 1 ] || exit "$rc"
          [ "$PERF_GATE" = true ] && exit 1
          echo "::warning title=perf regression (report only)::this run does not gate on perf; the report is in the run summary. release.yml and a manual dispatch gate."
      - if: always()
        name: Append the report to the run summary
        run: cat perf-out/report.md >>"$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-${{ github.sha }}
          path: |
            perf-out/samples.tsv
            perf-out/report.md
            perf-out/report.tsv
          retention-days: 90
          if-no-files-found: error
