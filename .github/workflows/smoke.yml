name: smoke
# Proves the release binary does real work on a clean Linux machine, not just inside the Bazel
# sandbox: build it with the release config, then run our smoke workflows against the machine
# itself (the local backend, no ssh), one GitHub step per workflow, each appending its report to
# the run summary.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-smoke-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: release
          ssh-target: "true" # the full suite needs it
      - run: bazel test --config=release //...
      - run: bazel build --config=release //src/cli:qwe
      - if: failure()
        uses: ./.github/actions/collect-logs
        with:
          name: smoke-build-logs
      - uses: actions/upload-artifact@v7
        with:
          name: qwe-build
          path: bazel-bin/src/cli/qwe
          if-no-files-found: error
  smoke:
    needs: build
    # A fresh runner with no shared setup: that setup's ssh-target step removes passwordless
    # sudo, which the become and apt smoke workflows need, and this job proves the binary needs
    # no Bazel to run.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: qwe-build
          path: .
      - run: chmod +x qwe
      - name: The binary is statically linked
        run: file qwe | grep -q "statically linked" || { file qwe; exit 1; }
      - name: smoke_run
        run: |
          ./qwe validate tests/smoke/smoke_run.yml &&
          ./qwe run tests/smoke/smoke_run.yml --summary "$GITHUB_STEP_SUMMARY"
      # The negative-case pattern (06), repeated by later tickets: the workflow step is
      # continue-on-error and tees qwe's output to a file; the assertion step right after it
      # fails the job unless the step's outcome was failure and the file has the expected
      # message. neg_file_ensure_denied.yml: file.ensure writing into a chmod 555 directory.
      - name: neg_file_ensure_denied
        id: neg_file_ensure_denied
        continue-on-error: true
        run: |
          ./qwe validate tests/smoke/neg_file_ensure_denied.yml
          ./qwe run tests/smoke/neg_file_ensure_denied.yml 2>&1 | tee "$RUNNER_TEMP/neg_file_ensure_denied.out"
      - name: neg_file_ensure_denied must fail with a helpful message
        run: |
          if [ "${{ steps.neg_file_ensure_denied.outcome }}" != "failure" ]; then
            echo "neg_file_ensure_denied: expected the step to fail, outcome was '${{ steps.neg_file_ensure_denied.outcome }}'" >&2
            exit 1
          fi
          grep -F "file.ensure: cannot write roDir/f.txt: Permission denied" "$RUNNER_TEMP/neg_file_ensure_denied.out" || {
            echo "neg_file_ensure_denied: expected message not found in the step's output" >&2
            exit 1
          }
