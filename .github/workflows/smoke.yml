name: smoke
# Proves the release binary does real work on a clean Linux machine, not just inside the Bazel
# sandbox. debug-smoke runs first: the fastbuild binary (no optimizer, so none of the
# --config=release miscompiles below can happen here) runs the same smoke checks with --debug
# tracing on. It is cheap and reliable, so a real bug in the smoke workflows themselves fails
# fast, before paying for the release build and its full suite under --config=release. Only once
# debug-smoke is green does build run bazel test --config=release //... and build the release
# binary; smoke then runs that binary's smoke workflows on a clean runner, one GitHub step per
# workflow, each appending its report to the run summary.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-smoke-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  debug-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: tests
      - run: bazel build //src/cli:qwe
      - name: smoke_run
        run: |
          bazel-bin/src/cli/qwe validate tests/smoke/smoke_run.yml &&
          bazel-bin/src/cli/qwe run tests/smoke/smoke_run.yml --debug --summary "$GITHUB_STEP_SUMMARY"
      # apt.package (10) needs real apt-get and root: `# smoke: skip-in-bazel:` in
      # smoke_apt.yml itself keeps the full Bazel suite from ever trying to run it, so it
      # needs this explicit step, like smoke_run above.
      - name: smoke_apt
        run: |
          bazel-bin/src/cli/qwe validate tests/smoke/smoke_apt.yml &&
          bazel-bin/src/cli/qwe run tests/smoke/smoke_apt.yml --debug --summary "$GITHUB_STEP_SUMMARY"
      # become (11) needs real passwordless sudo: same skip-in-bazel story as smoke_apt.
      - name: smoke_become
        run: |
          bazel-bin/src/cli/qwe validate tests/smoke/smoke_become.yml &&
          bazel-bin/src/cli/qwe run tests/smoke/smoke_become.yml --debug --summary "$GITHUB_STEP_SUMMARY"
      # secrets (11): gen_secrets.sh generates smoke_secrets.yml from its .in template with
      # a fresh per-run encrypted value, runs it, and asserts the value leaked nowhere.
      - name: smoke_secrets
        run: tests/smoke/gen_secrets.sh bazel-bin/src/cli/qwe tests/smoke
      # smoke_graph.yml itself (the diamond, the rendezvous, a's own output, d's files) is
      # covered generically by tests/smoke:smoke_workflows_test in the build job below; these
      # two steps are only to prove --job selection (12) for real: --job d runs the full
      # needs closure, --job b only a and b (no c or d in the summary).
      - name: smoke_graph --job d
        run: |
          bazel-bin/src/cli/qwe validate tests/smoke/smoke_graph.yml &&
          bazel-bin/src/cli/qwe run tests/smoke/smoke_graph.yml --job d --debug --summary "$GITHUB_STEP_SUMMARY"
      - name: smoke_graph --job b (only a and b run)
        run: bazel-bin/src/cli/qwe run tests/smoke/smoke_graph.yml --job b --debug --summary "$GITHUB_STEP_SUMMARY"
      # Same negative-case pattern as the smoke job below (06).
      - name: neg_file_ensure_denied
        id: neg_file_ensure_denied
        continue-on-error: true
        run: |
          set -o pipefail
          bazel-bin/src/cli/qwe validate tests/smoke/neg_file_ensure_denied.yml
          bazel-bin/src/cli/qwe run tests/smoke/neg_file_ensure_denied.yml --debug 2>&1 | tee "$RUNNER_TEMP/neg_file_ensure_denied.out"
      - name: neg_file_ensure_denied must fail with a helpful message
        run: |
          if [ "${{ steps.neg_file_ensure_denied.outcome }}" != "failure" ]; then
            echo "neg_file_ensure_denied: expected the step to fail, outcome was '${{ steps.neg_file_ensure_denied.outcome }}'" >&2
            exit 1
          fi
          grep -F "file.ensure: cannot write roDir/f.txt: Permission denied" "$RUNNER_TEMP/neg_file_ensure_denied.out" || {
            echo "neg_file_ensure_denied: expected message not found in the step's output" >&2
            exit 1
          }
      # Same negative-case pattern, for file.read (07).
      - name: neg_file_read_denied
        id: neg_file_read_denied
        continue-on-error: true
        run: |
          set -o pipefail
          bazel-bin/src/cli/qwe validate tests/smoke/neg_file_read_denied.yml
          bazel-bin/src/cli/qwe run tests/smoke/neg_file_read_denied.yml --debug 2>&1 | tee "$RUNNER_TEMP/neg_file_read_denied.out"
      - name: neg_file_read_denied must fail with a helpful message
        run: |
          if [ "${{ steps.neg_file_read_denied.outcome }}" != "failure" ]; then
            echo "neg_file_read_denied: expected the step to fail, outcome was '${{ steps.neg_file_read_denied.outcome }}'" >&2
            exit 1
          fi
          grep -F "file.read: cannot read secret.txt: Permission denied" "$RUNNER_TEMP/neg_file_read_denied.out" || {
            echo "neg_file_read_denied: expected message not found in the step's output" >&2
            exit 1
          }
      # Same negative-case pattern, for assert (08).
      - name: neg_assert_mismatch
        id: neg_assert_mismatch
        continue-on-error: true
        run: |
          set -o pipefail
          bazel-bin/src/cli/qwe validate tests/smoke/neg_assert_mismatch.yml
          bazel-bin/src/cli/qwe run tests/smoke/neg_assert_mismatch.yml --debug 2>&1 | tee "$RUNNER_TEMP/neg_assert_mismatch.out"
      - name: neg_assert_mismatch must fail with a helpful message
        run: |
          if [ "${{ steps.neg_assert_mismatch.outcome }}" != "failure" ]; then
            echo "neg_assert_mismatch: expected the step to fail, outcome was '${{ steps.neg_assert_mismatch.outcome }}'" >&2
            exit 1
          fi
          grep -F "assert: values differ: expected equals what we wanted, actual not what we wanted" "$RUNNER_TEMP/neg_assert_mismatch.out" || {
            echo "neg_assert_mismatch: expected message not found in the step's output" >&2
            exit 1
          }
      # Same negative-case pattern, for file.line (09).
      - name: neg_file_line_readonly
        id: neg_file_line_readonly
        continue-on-error: true
        run: |
          set -o pipefail
          bazel-bin/src/cli/qwe validate tests/smoke/neg_file_line_readonly.yml
          bazel-bin/src/cli/qwe run tests/smoke/neg_file_line_readonly.yml --debug 2>&1 | tee "$RUNNER_TEMP/neg_file_line_readonly.out"
      - name: neg_file_line_readonly must fail with a helpful message
        run: |
          if [ "${{ steps.neg_file_line_readonly.outcome }}" != "failure" ]; then
            echo "neg_file_line_readonly: expected the step to fail, outcome was '${{ steps.neg_file_line_readonly.outcome }}'" >&2
            exit 1
          fi
          grep -F "file.line: cannot write roDir/f.txt: Permission denied" "$RUNNER_TEMP/neg_file_line_readonly.out" || {
            echo "neg_file_line_readonly: expected message not found in the step's output" >&2
            exit 1
          }
      # Same negative-case pattern, for apt.package (10): an unknown package name.
      - name: neg_apt_unknown
        id: neg_apt_unknown
        continue-on-error: true
        run: |
          set -o pipefail
          bazel-bin/src/cli/qwe validate tests/smoke/neg_apt_unknown.yml
          bazel-bin/src/cli/qwe run tests/smoke/neg_apt_unknown.yml --debug 2>&1 | tee "$RUNNER_TEMP/neg_apt_unknown.out"
      - name: neg_apt_unknown must fail with a helpful message
        run: |
          if [ "${{ steps.neg_apt_unknown.outcome }}" != "failure" ]; then
            echo "neg_apt_unknown: expected the step to fail, outcome was '${{ steps.neg_apt_unknown.outcome }}'" >&2
            exit 1
          fi
          grep -F "apt.package: no package no-such-package-xyz" "$RUNNER_TEMP/neg_apt_unknown.out" || {
            echo "neg_apt_unknown: expected message not found in the step's output" >&2
            exit 1
          }
      # Same negative-case pattern, for apt.package (10): installing without become: true.
      - name: neg_apt_no_become
        id: neg_apt_no_become
        continue-on-error: true
        run: |
          set -o pipefail
          bazel-bin/src/cli/qwe validate tests/smoke/neg_apt_no_become.yml
          bazel-bin/src/cli/qwe run tests/smoke/neg_apt_no_become.yml --debug 2>&1 | tee "$RUNNER_TEMP/neg_apt_no_become.out"
      - name: neg_apt_no_become must fail with a helpful message
        run: |
          if [ "${{ steps.neg_apt_no_become.outcome }}" != "failure" ]; then
            echo "neg_apt_no_become: expected the step to fail, outcome was '${{ steps.neg_apt_no_become.outcome }}'" >&2
            exit 1
          fi
          grep -F "apt.package: cannot install hello: are you root? (set become: true)" "$RUNNER_TEMP/neg_apt_no_become.out" || {
            echo "neg_apt_no_become: expected message not found in the step's output" >&2
            exit 1
          }
      - if: failure()
        uses: ./.github/actions/collect-logs
        with:
          name: debug-smoke-logs
      # --debug's lifecycle.trace, kept whenever this job fails: cheap, standing extra signal,
      # never a step to remember to add back.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: debug-smoke-runs
          path: .qwe/runs
          if-no-files-found: ignore
  build:
    needs: debug-smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: release
          ssh-target: "true" # the full suite needs it
          apt: gdb # the backtrace step below needs it; cheap even on the runs that never use it
      - name: bazel test --config=release //...
        id: release_tests
        continue-on-error: true
        run: set -o pipefail; bazel test --config=release //... 2>&1 | tee "$RUNNER_TEMP/release-tests.log"
      # Standing infrastructure, not a one-off diagnostic to add and remove: whenever a test
      # crashes under --config=release, this re-runs its already-built binary directly under gdb
      # and keeps the backtrace as an artifact, every time, automatically. A crashed binary
      # usually finds its own runfiles unaided (bazel lays them out next to it); if one does not,
      # its backtrace step is just empty. Capped at 20 targets so a bad run cannot make this step
      # itself the slow part.
      - name: gdb backtrace of any crashed test
        if: steps.release_tests.outcome == 'failure'
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/backtraces"
          bin_root=$(bazel info bazel-bin --config=release)
          grep -oE '^FAIL: //[^ ]+ \((Segmentation fault|Aborted|Bus error|Killed)\)' "$RUNNER_TEMP/release-tests.log" |
            sed -E 's/^FAIL: (\/\/[^ ]+) \(.*/\1/' | sort -u | head -20 |
            while IFS= read -r target; do
              rel=${target#//}
              rel=${rel/:/\/}
              bin="$bin_root/$rel"
              [ -x "$bin" ] || continue
              out="$RUNNER_TEMP/backtraces/$(echo "$target" | tr '/:' '__').txt"
              { echo "=== $target ($bin) ==="
                gdb --batch -ex run -ex "bt full" -ex "info registers" --args "$bin"
              } >"$out" 2>&1 || true
            done
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-release-backtraces
          path: ${{ runner.temp }}/backtraces
          if-no-files-found: ignore
      - name: fail if the release suite failed
        if: steps.release_tests.outcome == 'failure'
        run: exit 1
      - run: bazel build --config=release //src/cli:qwe
      - if: failure()
        uses: ./.github/actions/collect-logs
        with:
          name: smoke-build-logs
      - uses: actions/upload-artifact@v7
        with:
          name: qwe-build
          path: bazel-bin/src/cli/qwe
          if-no-files-found: error
  smoke:
    needs: build
    # A fresh runner with no shared setup: that setup's ssh-target step removes passwordless
    # sudo, which the become and apt smoke workflows need, and this job proves the binary needs
    # no Bazel to run.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: qwe-build
          path: .
      - run: chmod +x qwe
      - name: The binary is statically linked
        run: file qwe | grep -q "statically linked" || { file qwe; exit 1; }
      - name: smoke_run
        run: |
          ./qwe validate tests/smoke/smoke_run.yml &&
          ./qwe run tests/smoke/smoke_run.yml --summary "$GITHUB_STEP_SUMMARY"
      # apt.package (10) needs real apt-get and root: `# smoke: skip-in-bazel:` in
      # smoke_apt.yml itself keeps the full Bazel suite from ever trying to run it, so it
      # needs this explicit step, like smoke_run above.
      - name: smoke_apt
        run: |
          ./qwe validate tests/smoke/smoke_apt.yml &&
          ./qwe run tests/smoke/smoke_apt.yml --summary "$GITHUB_STEP_SUMMARY"
      # become (11) needs real passwordless sudo: same skip-in-bazel story as smoke_apt.
      - name: smoke_become
        run: |
          ./qwe validate tests/smoke/smoke_become.yml &&
          ./qwe run tests/smoke/smoke_become.yml --summary "$GITHUB_STEP_SUMMARY"
      # secrets (11): gen_secrets.sh generates smoke_secrets.yml from its .in template with
      # a fresh per-run encrypted value, runs it, and asserts the value leaked nowhere.
      - name: smoke_secrets
        run: tests/smoke/gen_secrets.sh ./qwe tests/smoke
      # smoke_graph.yml itself is covered generically by tests/smoke:smoke_workflows_test in
      # the build job; these two steps prove --job selection (12) against the shipped
      # binary: --job d runs the full needs closure, --job b only a and b.
      - name: smoke_graph --job d
        run: |
          ./qwe validate tests/smoke/smoke_graph.yml &&
          ./qwe run tests/smoke/smoke_graph.yml --job d --summary "$GITHUB_STEP_SUMMARY"
      - name: smoke_graph --job b (only a and b run)
        run: ./qwe run tests/smoke/smoke_graph.yml --job b --summary "$GITHUB_STEP_SUMMARY"
      # The negative-case pattern (06), repeated by later tickets: the workflow step is
      # continue-on-error and tees qwe's output to a file; the assertion step right after it
      # fails the job unless the step's outcome was failure and the file has the expected
      # message. neg_file_ensure_denied.yml: file.ensure writing into a chmod 555 directory.
      - name: neg_file_ensure_denied
        id: neg_file_ensure_denied
        continue-on-error: true
        run: |
          set -o pipefail
          ./qwe validate tests/smoke/neg_file_ensure_denied.yml
          ./qwe run tests/smoke/neg_file_ensure_denied.yml 2>&1 | tee "$RUNNER_TEMP/neg_file_ensure_denied.out"
      - name: neg_file_ensure_denied must fail with a helpful message
        run: |
          if [ "${{ steps.neg_file_ensure_denied.outcome }}" != "failure" ]; then
            echo "neg_file_ensure_denied: expected the step to fail, outcome was '${{ steps.neg_file_ensure_denied.outcome }}'" >&2
            exit 1
          fi
          grep -F "file.ensure: cannot write roDir/f.txt: Permission denied" "$RUNNER_TEMP/neg_file_ensure_denied.out" || {
            echo "neg_file_ensure_denied: expected message not found in the step's output" >&2
            exit 1
          }
      # Same negative-case pattern, for file.read (07).
      - name: neg_file_read_denied
        id: neg_file_read_denied
        continue-on-error: true
        run: |
          set -o pipefail
          ./qwe validate tests/smoke/neg_file_read_denied.yml
          ./qwe run tests/smoke/neg_file_read_denied.yml 2>&1 | tee "$RUNNER_TEMP/neg_file_read_denied.out"
      - name: neg_file_read_denied must fail with a helpful message
        run: |
          if [ "${{ steps.neg_file_read_denied.outcome }}" != "failure" ]; then
            echo "neg_file_read_denied: expected the step to fail, outcome was '${{ steps.neg_file_read_denied.outcome }}'" >&2
            exit 1
          fi
          grep -F "file.read: cannot read secret.txt: Permission denied" "$RUNNER_TEMP/neg_file_read_denied.out" || {
            echo "neg_file_read_denied: expected message not found in the step's output" >&2
            exit 1
          }
      # Same negative-case pattern, for assert (08).
      - name: neg_assert_mismatch
        id: neg_assert_mismatch
        continue-on-error: true
        run: |
          set -o pipefail
          ./qwe validate tests/smoke/neg_assert_mismatch.yml
          ./qwe run tests/smoke/neg_assert_mismatch.yml 2>&1 | tee "$RUNNER_TEMP/neg_assert_mismatch.out"
      - name: neg_assert_mismatch must fail with a helpful message
        run: |
          if [ "${{ steps.neg_assert_mismatch.outcome }}" != "failure" ]; then
            echo "neg_assert_mismatch: expected the step to fail, outcome was '${{ steps.neg_assert_mismatch.outcome }}'" >&2
            exit 1
          fi
          grep -F "assert: values differ: expected equals what we wanted, actual not what we wanted" "$RUNNER_TEMP/neg_assert_mismatch.out" || {
            echo "neg_assert_mismatch: expected message not found in the step's output" >&2
            exit 1
          }
      # Same negative-case pattern, for file.line (09).
      - name: neg_file_line_readonly
        id: neg_file_line_readonly
        continue-on-error: true
        run: |
          set -o pipefail
          ./qwe validate tests/smoke/neg_file_line_readonly.yml
          ./qwe run tests/smoke/neg_file_line_readonly.yml 2>&1 | tee "$RUNNER_TEMP/neg_file_line_readonly.out"
      - name: neg_file_line_readonly must fail with a helpful message
        run: |
          if [ "${{ steps.neg_file_line_readonly.outcome }}" != "failure" ]; then
            echo "neg_file_line_readonly: expected the step to fail, outcome was '${{ steps.neg_file_line_readonly.outcome }}'" >&2
            exit 1
          fi
          grep -F "file.line: cannot write roDir/f.txt: Permission denied" "$RUNNER_TEMP/neg_file_line_readonly.out" || {
            echo "neg_file_line_readonly: expected message not found in the step's output" >&2
            exit 1
          }
      # Same negative-case pattern, for apt.package (10): an unknown package name.
      - name: neg_apt_unknown
        id: neg_apt_unknown
        continue-on-error: true
        run: |
          set -o pipefail
          ./qwe validate tests/smoke/neg_apt_unknown.yml
          ./qwe run tests/smoke/neg_apt_unknown.yml 2>&1 | tee "$RUNNER_TEMP/neg_apt_unknown.out"
      - name: neg_apt_unknown must fail with a helpful message
        run: |
          if [ "${{ steps.neg_apt_unknown.outcome }}" != "failure" ]; then
            echo "neg_apt_unknown: expected the step to fail, outcome was '${{ steps.neg_apt_unknown.outcome }}'" >&2
            exit 1
          fi
          grep -F "apt.package: no package no-such-package-xyz" "$RUNNER_TEMP/neg_apt_unknown.out" || {
            echo "neg_apt_unknown: expected message not found in the step's output" >&2
            exit 1
          }
      # Same negative-case pattern, for apt.package (10): installing without become: true.
      - name: neg_apt_no_become
        id: neg_apt_no_become
        continue-on-error: true
        run: |
          set -o pipefail
          ./qwe validate tests/smoke/neg_apt_no_become.yml
          ./qwe run tests/smoke/neg_apt_no_become.yml 2>&1 | tee "$RUNNER_TEMP/neg_apt_no_become.out"
      - name: neg_apt_no_become must fail with a helpful message
        run: |
          if [ "${{ steps.neg_apt_no_become.outcome }}" != "failure" ]; then
            echo "neg_apt_no_become: expected the step to fail, outcome was '${{ steps.neg_apt_no_become.outcome }}'" >&2
            exit 1
          fi
          grep -F "apt.package: cannot install hello: are you root? (set become: true)" "$RUNNER_TEMP/neg_apt_no_become.out" || {
            echo "neg_apt_no_become: expected message not found in the step's output" >&2
            exit 1
          }
