name: nightly
# The push-cadence gates rerun at night from caches rebuilt from scratch, plus smoke, so a
# stale cache never quietly outlives what a push would have caught. (release.yml runs the
# same gates again at a tag.) valgrind and fuzz are NOT called from here: each schedules
# itself independently, a few minutes after this file's own cron, so their own badges track
# a real nightly run -- a workflow_call from a job in this file would never update them
# (only push/pull_request/schedule/workflow_dispatch do). refresh-caches deletes every
# setup-bazel-* cache repo-wide, so their disk caches go cold too, on the same schedule as
# everything else here, even though nothing in this file's job graph runs them.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  refresh-caches:
    # A cache key never changes once saved, so the gates' caches go stale. Drop them all;
    # the gates below run cold and save fresh ones, which pushes to main then restore.
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key setup-bazel- --limit 100 --json id -q '.[].id' |
            xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY"
  tests:
    needs: refresh-caches
    uses: ./.github/workflows/tests.yml
  asan:
    needs: refresh-caches
    uses: ./.github/workflows/asan.yml
  ubsan:
    needs: refresh-caches
    uses: ./.github/workflows/ubsan.yml
  static-analysis:
    needs: refresh-caches
    uses: ./.github/workflows/static-analysis.yml
  coverage:
    needs: refresh-caches
    uses: ./.github/workflows/coverage.yml
    permissions: # the called workflow's pages job asks for these, though it only runs on a push to main
      contents: read
      pages: write
      id-token: write
  smoke:
    needs: refresh-caches
    uses: ./.github/workflows/smoke.yml
