name: ubsan
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ubsan-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  ubsan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-key: ubsan
          ssh-target: "true"
      - run: bazel test --config=ubsan //...
      - if: failure()
        uses: ./.github/actions/collect-logs
        with:
          name: ubsan-logs
