name: tests
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-tests-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: tests
          ssh-target: "true"
      - name: bazel test //...
        run: |
          set -o pipefail
          bazel test //... 2>&1 | tee "$RUNNER_TEMP/bazel-test.log"
      # A table in the run summary, one row per tests/e2e case, linking back to its
      # directory (same idea as smoke.yml's summary-link.sh): always, not just on failure,
      # so it is there to browse either way.
      - name: e2e summary
        if: always()
        run: .github/scripts/e2e-summary.sh "$RUNNER_TEMP/bazel-test.log"
      - if: failure()
        uses: ./.github/actions/collect-logs
        with:
          name: tests-logs
