name: release
# A release is a pushed tag v<version>. Write the release in the GitHub web UI (notes, and the tag
# it creates on publish), or push a tag. Every gate runs again at that commit; then the binaries
# and checksums are attached to the release (created here if the tag has none). If any gate or
# the version check fails, an existing release is turned back into a draft, so nothing broken
# stays public. Fuzzing is not part of this.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  asan:
    uses: ./.github/workflows/asan.yml
  ubsan:
    uses: ./.github/workflows/ubsan.yml
  valgrind:
    uses: ./.github/workflows/valgrind.yml
  coverage:
    uses: ./.github/workflows/coverage.yml
    permissions: # the called workflow's pages job asks for these, though it only runs on a push to main
      contents: read
      pages: write
      id-token: write
  smoke:
    # exclude-tag: the web-UI release flow publishes this tag before the gates run, so
    # smoke's own perf job's "latest release" search would otherwise find this release
    # itself as the baseline.
    uses: ./.github/workflows/smoke.yml
    with:
      exclude-tag: ${{ github.ref_name }}
  publish:
    needs: [tests, asan, ubsan, valgrind, coverage, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: release
      - name: Build
        run: bazel build --config=release //src/cli:qwe //src/cli:qwe-debug
      - name: The version matches the tag
        run: tools/release/check_version.sh "$TAG" bazel-bin/src/cli/qwe
      - name: Package
        run: |
          set -eu
          v=${TAG#v}
          mkdir dist
          cp bazel-bin/src/cli/qwe "dist/qwe-$v-linux-x86_64"
          cp bazel-bin/src/cli/qwe-debug "dist/qwe-debug-$v-linux-x86_64"
          file dist/*
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Attach to the release
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          note="Built from commit \`$sha\`, after all gates passed on it."
          pre=
          case $TAG in *-*) pre=--prerelease ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            body=$(gh release view "$TAG" --json body -q .body)
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --notes "$body

          $note"
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG ($(echo "$sha" | cut -c1-7))" $pre --generate-notes --notes "$note"
          fi
  draft-on-failure:
    # A release published in the web UI is already public when the gates start.
    needs: [tests, asan, ubsan, valgrind, coverage, smoke, publish]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft
            echo "$TAG turned back into a draft: a gate or the version check failed" >&2
          fi
