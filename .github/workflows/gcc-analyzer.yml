name: gcc-analyzer
# GCC's -fanalyzer, a second analyzer independent of clang-tidy's (ticket sca-round3/07,
# docs/static-analysis.md "GCC's analyzer"). Its findings change between GCC builds, so
# --exact refuses any gcc-13 but the one tools/gcc-analyzer/pin.env names; the runner
# image ships it, nothing is installed. A few seconds on top of the build. Its own workflow
# (it was a job in static-analysis.yml) so that it has its own README badge: a badge is per
# workflow file. nightly.yml and release.yml call it, like the other gates.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-gcc-analyzer-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  gcc-analyzer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          cache-key: gcc-analyzer
      - name: tools/gcc-analyzer/run.sh
        run: tools/gcc-analyzer/run.sh --exact --evidence-dir "$RUNNER_TEMP/gcc-analyzer-evidence"
      # The same kind of evidence as clang-tidy's: gcc --version and the package version,
      # the config, the analyzed file list, the git SHA, the full output and the exit status.
      # release.yml attaches it to the release.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gcc-analyzer-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/gcc-analyzer-evidence
          if-no-files-found: error
      - if: failure()
        uses: ./.github/actions/collect-logs
        with:
          name: gcc-analyzer-logs
