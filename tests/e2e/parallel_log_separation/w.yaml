jobs:
  a:
    target: local
    steps:
      - run: |
          touch a.mark
          i=0; while [ ! -e b.mark ] && [ $i -lt 100 ]; do sleep 0.05; i=$((i+1)); done
          seq 1 50000 | sed 's/^/A /'
  b:
    target: local
    steps:
      - run: |
          touch b.mark
          i=0; while [ ! -e a.mark ] && [ $i -lt 100 ]; do sleep 0.05; i=$((i+1)); done
          seq 1 50000 | sed 's/^/B /'
