# smoke: file.ensure, file.read, file.line, assert (07, 08, 09). Writes a config file, reads
# it back, patches a key with file.line (regexp, changed, then the same patch again
# unchanged), reads the patch, then removes a line with file.line (absent, changed), and
# reads that too.
name: smoke file
jobs:
  file:
    target: local
    steps:
      - id: ensure
        uses: file.ensure
        with:
          path: smoke-file.txt
          content: "greeting=hello from qwe smoke\nkey=old\n"
          mode: "0644"
      - id: read
        uses: file.read
        with:
          path: smoke-file.txt
      - uses: assert
        with: {actual: "${{ steps.read.outputs.exists }}", equals: "true"}
      - uses: assert
        with: {actual: "${{ steps.read.outputs.content }}", equals: "greeting=hello from qwe smoke\nkey=old\n"}
      - uses: assert
        with: {actual: "${{ steps.read.outputs.mode }}", equals: "0644"}
      - uses: assert
        with:
          actual: "${{ steps.read.outputs.sha256 }}"
          equals: "3dafb74c8e9b393c0b2691dc7cde2824037f15008a8daa212fedf0d7e1253272"
      - id: patch
        uses: file.line
        with:
          path: smoke-file.txt
          line: "key=patched"
          regexp: "^key="
      - id: patch-again
        uses: file.line
        with:
          path: smoke-file.txt
          line: "key=patched"
          regexp: "^key="
      - id: read-patched
        uses: file.read
        with:
          path: smoke-file.txt
      - uses: assert
        with:
          actual: "${{ steps.read-patched.outputs.content }}"
          equals: "greeting=hello from qwe smoke\nkey=patched\n"
      - id: remove
        uses: file.line
        with:
          path: smoke-file.txt
          line: "greeting=hello from qwe smoke"
          state: absent
      - id: read-removed
        uses: file.read
        with:
          path: smoke-file.txt
      - uses: assert
        with: {actual: "${{ steps.read-removed.outputs.content }}", equals: "key=patched\n"}
