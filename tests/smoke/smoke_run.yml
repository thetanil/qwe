# smoke: run. Proves the default step kind (run:) and its plumbing: multi-line scripts,
# workflow/job/step env: precedence, and a $QWE_OUTPUT step output read by a later step.
# Runs both against the shipped binary in the smoke GitHub job and against the fastbuild
# binary in `bazel test //...` (tests/smoke:smoke_workflows_test). The precedence and output
# checks are assert (08) steps rather than `run: test ... = ...`: assert fails with a message
# that names what was expected and what it actually got, instead of a bare exit 1.
name: smoke run
env:
  LEVEL: workflow
jobs:
  run:
    target: local
    env:
      LEVEL: job
    steps:
      - id: echo
        run: echo "hello from qwe smoke"
      - id: multiline
        run: |
          echo "line one"
          echo "line two"
          echo "line three"
      - id: job-env-wins-over-workflow
        uses: assert
        with:
          actual: "${{ env.LEVEL }}"
          equals: "job"
      - id: step-env-wins-over-job
        uses: assert
        with:
          actual: "${{ env.LEVEL }}"
          equals: "step"
        env:
          LEVEL: step
      - id: produce
        run: echo "greeting=hello smoke" >> "$QWE_OUTPUT"
      - id: consume
        uses: assert
        with:
          actual: "${{ steps.produce.outputs.greeting }}"
          equals: "hello smoke"
